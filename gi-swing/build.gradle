plugins {
    //id 'java'
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id("se.alipsa.nexus-release-plugin") version '2.2.0'
    id 'se.alipsa.gi.fatjar-conventions'
    id 'se.alipsa.gi.javafx-platform'
}

description = 'Allows Gade Gui Interactive capabilities from a standalone app'

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
  options.compilerArgs << '-parameters'
}

tasks.named('javadocJar', Jar) {
  from tasks.named('groovydoc')
  dependsOn tasks.named('groovydoc')
}

dependencies {
  def qualifier = javafxClassifier
  def javaFxVersion = libs.versions.javafx.get()

  api project(':gi-common')
  compileOnly libs.groovy
  implementation libs.swing.widgets

  // JavaFX is needed at compile-time only for matrix-charts type resolution
  // The actual JavaFX Chart types are referenced by matrix-charts but not used in gi-swing
  compileOnly "org.openjfx:javafx-graphics:${javaFxVersion}:$qualifier"
  compileOnly "org.openjfx:javafx-base:${javaFxVersion}:$qualifier"
  compileOnly "org.openjfx:javafx-controls:${javaFxVersion}:$qualifier"

  // SVG rendering is handled by matrix-charts SvgPanel
  testImplementation platform(libs.junit.bom)
  testImplementation libs.junit.jupiter
  testImplementation libs.groovy
  testRuntimeOnly libs.junit.platform.launcher
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    if (version.contains('SNAPSHOT')) {
        // Slows down the build (a lot), use only if local SNAPSHOTS are needed
        mavenLocal()
    }
}

test {
  useJUnitPlatform()
  systemProperty 'java.awt.headless', 'true'
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
      pom {
        name = 'Gade standalone GUI interaction library for Swing'
        description = "${project.description}"
        url = "https://github.com/Alipsa/GuiInteraction/tree/main/gi-swing"
        licenses {
          license {
            name = 'MIT License'
            url = 'https://raw.githubusercontent.com/Alipsa/GuiInteraction/main/LICENSE'
          }
        }
        developers {
          developer {
            id = 'perNyfelt'
            name = 'Per Nyfelt'
          }
        }
        scm {
          url = 'https://github.com/Alipsa/GuiInteraction/tree/main'
          connection = 'scm:git:https://github.com/Alipsa/GuiInteraction.git'
          developerConnection = 'scm:git:https://github.com/Alipsa/GuiInteraction.git'
        }
      }
    }
  }
}

signing {
  if (project.properties['signing.keyId'] != null) {
    sign publishing.publications.maven
  } else {
    project.logger.lifecycle("signing.keyId is not defined, skipping signing of artifacts...")
  }
}

nexusReleasePlugin {
  userName = project.ext.properties.sonatypeUsername
  password = project.ext.properties.sonatypePassword
  mavenPublication = publishing.publications.maven
}
